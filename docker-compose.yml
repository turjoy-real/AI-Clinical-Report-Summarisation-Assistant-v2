services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      CHROMA_DIR: /app/data/chroma
      CHECKPOINT_DIR: /app/backend/.checkpoints
      LOG_DIR: /app/backend/.runs
      FRONTEND_ORIGIN: http://localhost:5173
      MOCK_LLM: "true"
    volumes:
      - ./data:/app/data
      - ./backend/.runs:/app/backend/.runs
      - ./backend/.checkpoints:/app/backend/.checkpoints

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend
